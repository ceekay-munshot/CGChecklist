name: analyze

# Source-first CG-checklist run for one company. Harvests Screener + the annual
# report, answers all 51 questions from those filings (MUNS backfill for gaps),
# and uploads the Beas-format Excel + a results JSON as an artifact.
#
# Actions → analyze → Run workflow → enter a ticker (e.g. CAPILLARY).

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE/BSE ticker (Screener symbol), e.g. CAPILLARY"
        required: true
      company:
        description: "Company name (optional — helps MUNS resolve the right entity)"
        required: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Claude via Bedrock (primary). TEMP_CLAUDE_TOKEN is a Bedrock API key.
      CLAUDE_BEDROCK_API_KEY: ${{ secrets.TEMP_CLAUDE_TOKEN }}
      CLAUDE_BEDROCK_REGION: ${{ vars.CLAUDE_BEDROCK_REGION }}
      CLAUDE_BEDROCK_MODEL_ID: ${{ vars.CLAUDE_BEDROCK_MODEL_ID }}
      # Acquisition
      SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # Backfill
      MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
      # Don't run the OpenNext/Cloudflare build on install for this job.
      SKIP_POSTINSTALL_BUILD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.62.1 install --with-deps chromium
      - name: Analyze
        run: npx tsx --tsconfig tsconfig.json scripts/analyze.ts "${{ inputs.ticker }}" "${{ inputs.company }}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-report-${{ inputs.ticker }}
          path: report-output/
          if-no-files-found: warn
      # Publish the results straight into the dashboard's KV so the run is
      # visible in the app. Writes report:<COUNTRY>:<TICKER> (India-only engine),
      # reusing the Cloudflare deploy credentials — no new secrets required.
      - name: Publish report to dashboard KV
        if: success()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          KV_NAMESPACE_ID: "9044ac1b534e49ebb1d36ccfd40895bd"
        run: |
          set -euo pipefail
          TICKER=$(echo "${{ inputs.ticker }}" | tr '[:lower:]' '[:upper:]')
          SRC="report-output/${TICKER}-results.json"
          if [ ! -f "$SRC" ]; then
            echo "No results file at $SRC — skipping KV publish."
            exit 0
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set — skipping KV publish."
            exit 0
          fi
          # Stamp the value with storedAt + country so the dashboard read route
          # (GET /api/report/get) can surface it exactly as it stores MUNS runs.
          jq '. + {storedAt: (now * 1000 | floor), country: "INDIA"}' "$SRC" > report-output/kv-value.json
          KEY="report:INDIA:${TICKER}"
          echo "Publishing $KEY to KV namespace ${KV_NAMESPACE_ID}…"
          npx --yes wrangler@4 kv key put "$KEY" \
            --path report-output/kv-value.json \
            --namespace-id "$KV_NAMESPACE_ID" \
            --remote
          echo "Published $KEY."
