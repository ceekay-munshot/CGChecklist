name: Deploy to Cloudflare Workers

# The live site deploys through Cloudflare's own Git build (connected to this
# repo), not this workflow. This Action is kept only as a manual fallback and no
# longer runs on push — on push it just failed on a missing CLOUDFLARE_API_TOKEN
# and posted a misleading red "deploy failed" on every commit. Run it by hand
# (Actions → Deploy to Cloudflare Workers → Run workflow) only if you ever want
# GitHub to deploy, in which case set the CLOUDFLARE_API_TOKEN / _ACCOUNT_ID
# secrets first.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          SKIP_POSTINSTALL_BUILD: '1'

      - name: Build for Cloudflare
        run: npx opennextjs-cloudflare build

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
