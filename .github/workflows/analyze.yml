name: analyze

# Source-first CG-checklist run for one company. Harvests Screener + the annual
# report, answers all 51 questions from those filings (MUNS backfill for gaps),
# and uploads the Beas-format Excel + a results JSON as an artifact.
#
# Actions → analyze → Run workflow → enter a ticker (e.g. CAPILLARY).

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "NSE/BSE ticker (Screener symbol), e.g. CAPILLARY"
        required: true
      company:
        description: "Company name (optional — helps MUNS resolve the right entity)"
        required: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Claude via Bedrock (primary). TEMP_CLAUDE_TOKEN is a Bedrock API key.
      CLAUDE_BEDROCK_API_KEY: ${{ secrets.TEMP_CLAUDE_TOKEN }}
      CLAUDE_BEDROCK_REGION: ${{ vars.CLAUDE_BEDROCK_REGION }}
      CLAUDE_BEDROCK_MODEL_ID: ${{ vars.CLAUDE_BEDROCK_MODEL_ID }}
      # Acquisition
      SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
      SCREENER_PASSWORD: ${{ secrets.SCREENER_PASSWORD }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      # Backfill
      MUNS_TOKEN: ${{ secrets.MUNS_TOKEN }}
      # Don't run the OpenNext/Cloudflare build on install for this job.
      SKIP_POSTINSTALL_BUILD: "1"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx -y playwright@1.62.1 install --with-deps chromium
      - name: Analyze
        run: npx tsx --tsconfig tsconfig.json scripts/analyze.ts "${{ inputs.ticker }}" "${{ inputs.company }}"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cg-report-${{ inputs.ticker }}
          path: report-output/
          if-no-files-found: warn
      # Publish the results into the dashboard so the run is visible. The Worker
      # writes its own KV through its binding, so we just POST the results.json
      # to /api/report/ingest with a shared token — no Cloudflare API token
      # needed (this repo's Actions don't hold one; the site deploys via
      # Cloudflare's own build). Set REPORT_INGEST_TOKEN as a repo secret AND as
      # the same-named worker secret. REPORT_INGEST_URL overrides the site URL.
      - name: Publish report to dashboard
        if: success()
        env:
          REPORT_INGEST_TOKEN: ${{ secrets.REPORT_INGEST_TOKEN }}
          REPORT_INGEST_URL: ${{ vars.REPORT_INGEST_URL }}
        run: |
          set -euo pipefail
          TICKER=$(echo "${{ inputs.ticker }}" | tr '[:lower:]' '[:upper:]')
          SRC="report-output/${TICKER}-results.json"
          if [ ! -f "$SRC" ]; then
            echo "No results file at $SRC — skipping publish."
            exit 0
          fi
          if [ -z "${REPORT_INGEST_TOKEN:-}" ]; then
            echo "REPORT_INGEST_TOKEN not set — skipping publish (the dashboard run button / results won't update until it's set)."
            exit 0
          fi
          BASE="${REPORT_INGEST_URL:-https://cgchecklist.amazon-review-radar-489675.workers.dev}"
          echo "Publishing ${TICKER} to ${BASE}/api/report/ingest…"
          CODE=$(curl -sS -o /tmp/ingest-resp.json -w "%{http_code}" \
            -X POST "${BASE}/api/report/ingest" \
            -H "Authorization: Bearer ${REPORT_INGEST_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@${SRC}")
          echo "HTTP ${CODE}: $(cat /tmp/ingest-resp.json)"
          if [ "$CODE" != "200" ]; then
            echo "Publish failed (HTTP ${CODE})."
            exit 1
          fi
          echo "Published ${TICKER} to the dashboard."
